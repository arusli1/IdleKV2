[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idlekv"
version = "0.1.0"
description = "KV cache quality recovery during agentic idle time"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate",
    "datasets",
    "pyyaml",
    "tqdm",
    "pandas",
    "matplotlib",
    "seaborn",
]

[tool.setuptools.packages.find]
include = ["idlekv*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that load a real model or run longer end-to-end flows",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "black",
    "ruff",
]
flash = [
    "flash-attn",
]
baselines = [
    "kvpress",
]
