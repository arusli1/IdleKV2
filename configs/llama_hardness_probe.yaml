# Tiny Llama support probe
# Purpose: decide whether Llama belongs in the SCALE matrix or should be
# deferred to the larger-GPU expansion because 4K is a ceiling slice.

hardware: a10g_24gb

models:
  - name: meta-llama/Llama-3.1-8B-Instruct
    short: llama8b

compression:
  ratios: [0.7]
  primary_ratio: 0.7
  shadow_buffer_size: 256
  query_buffer_size: 32
  offload_full_kv: true

simulation:
  tool_call_interval: 100
  duration_median_ms: 1000
  duration_min_ms: 100
  duration_max_ms: 10000

evaluation:
  seeds: [42]
  benchmarks:
    - ruler
  benchmarks_by_type:
    baseline: [ruler]
    idlekv: [ruler]
    ablation_buffer: [ruler]
  ruler:
    context_lengths: [8192]
  longbench:
    max_input_length: 4096
  throughput:
    num_warmup_tokens: 32
    num_measure_tokens: 128

baselines:
  - name: full_cache
    ratio: null
  - name: snapkv_0.7
    ratio: 0.7
    method: snapkv

idlekv:
  conditions:
    - idle_budget_ms: 0
      phases: 1
    - idle_budget_ms: 100
      phases: 1

ablations:
  shadow_buffer_sizes: [256]

output_dir: results/llama_hardness_probe/
