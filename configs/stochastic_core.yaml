# Stochastic anytime repair core matrix
# Purpose: make stochastic anytime repair the primary method story on the
# informative Qwen RULER-4K slice, with conservative A10G-safe budgets.

hardware: a10g_24gb

models:
  - name: Qwen/Qwen2.5-7B-Instruct
    short: qwen7b

compression:
  ratios: [0.5, 0.7]
  primary_ratio: 0.7
  shadow_buffer_size: 256
  query_buffer_size: 32
  offload_full_kv: true

simulation:
  tool_call_interval: 100
  duration_median_ms: 1000
  duration_min_ms: 100
  duration_max_ms: 10000

evaluation:
  seeds: [42, 123, 456]
  benchmarks:
    - ruler
  benchmarks_by_type:
    baseline: [ruler]
    idlekv: [ruler]
    ablation_buffer: [ruler]
  ruler:
    context_lengths: [4096]
  longbench:
    max_input_length: 4096
  throughput:
    num_warmup_tokens: 32
    num_measure_tokens: 128

baselines:
  - name: full_cache
    ratio: null
  - name: snapkv_0.7
    ratio: 0.7
    method: snapkv
  - name: snapkv_0.5
    ratio: 0.5
    method: snapkv
  - name: h2o_0.5
    ratio: 0.5
    method: h2o

idlekv:
  refinement_policy: sampled_spans
  min_idle_ms: 20
  shadow_only_max_ms: 80
  sample_span_size: 16
  sample_spans_per_layer: 2
  sample_sampler_seed: 0
  conditions:
    - idle_budget_ms: 0
      phases: 1
      policy: sampled_spans
    - idle_budget_ms: 50
      phases: 1
      policy: sampled_spans
    - idle_budget_ms: 100
      phases: 1
      policy: sampled_spans
    - idle_budget_ms: 200
      phases: 1
      policy: sampled_spans
    - idle_budget_ms: 500
      phases: 1
      policy: sampled_spans
    - idle_budget_ms: 1000
      phases: 1
      policy: sampled_spans

ablations:
  shadow_buffer_sizes: [0, 256]

output_dir: results/stochastic_core/
