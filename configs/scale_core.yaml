# SCALE 2026 core matrix
# Purpose: smallest credible workshop matrix after the Phase 1 scouts landed.
# Center the paper on the informative Qwen slice and the short-idle claim.

hardware: a10g_24gb

models:
  - name: Qwen/Qwen2.5-7B-Instruct
    short: qwen7b

compression:
  ratios: [0.5, 0.7]
  primary_ratio: 0.7
  shadow_buffer_size: 256
  query_buffer_size: 32
  offload_full_kv: true

simulation:
  tool_call_interval: 100
  duration_median_ms: 1000
  duration_min_ms: 100
  duration_max_ms: 10000

evaluation:
  seeds: [42, 123, 456]
  benchmarks:
    - ruler
  benchmarks_by_type:
    baseline: [ruler]
    idlekv: [ruler]
    ablation_buffer: [ruler]
  ruler:
    context_lengths: [4096]
  longbench:
    max_input_length: 4096
  throughput:
    num_warmup_tokens: 32
    num_measure_tokens: 128

baselines:
  - name: full_cache
    ratio: null
  - name: snapkv_0.7
    ratio: 0.7
    method: snapkv
  - name: snapkv_0.5
    ratio: 0.5
    method: snapkv
  - name: h2o_0.5
    ratio: 0.5
    method: h2o

idlekv:
  # Keep only the exact workshop-core operating points.
  conditions:
    - idle_budget_ms: 0
      phases: 1
    - idle_budget_ms: 100
      phases: 1

ablations:
  shadow_buffer_sizes: [0, 256]

output_dir: results/scale_core/
