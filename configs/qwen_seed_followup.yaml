# Qwen-only follow-up scout
# Purpose: verify that the current Qwen signal is robust across seeds and
# directly compare the winning short-idle Phase 1 path against the suspicious
# long-budget Phase 2 path.

hardware: a10g_24gb

models:
  - name: Qwen/Qwen2.5-7B-Instruct
    short: qwen7b

compression:
  ratios: [0.7]
  primary_ratio: 0.7
  shadow_buffer_size: 256
  query_buffer_size: 32
  offload_full_kv: true

simulation:
  tool_call_interval: 100
  duration_median_ms: 1000
  duration_min_ms: 100
  duration_max_ms: 10000

evaluation:
  seeds: [123, 456]
  benchmarks:
    - ruler
  benchmarks_by_type:
    baseline: [ruler]
    idlekv: [ruler]
    ablation_buffer: [ruler]
  ruler:
    context_lengths: [4096]
  longbench:
    max_input_length: 4096
  throughput:
    num_warmup_tokens: 32
    num_measure_tokens: 128

baselines:
  - name: full_cache
    ratio: null
  - name: snapkv_0.7
    ratio: 0.7
    method: snapkv

idlekv:
  # Explicit scout conditions, not a cartesian product.
  # `100ms + 1+2` is intentionally omitted because the scheduler only allows
  # Phase 2 when `max_time_ms > 100`, so that condition is just Phase 1 again.
  conditions:
    - idle_budget_ms: 0
      phases: 1
    - idle_budget_ms: 100
      phases: 1
    - idle_budget_ms: 1000
      phases: 1
    - idle_budget_ms: 1000
      phases: "1+2"

ablations:
  shadow_buffer_sizes: [256]

output_dir: results/qwen_seed_followup/
